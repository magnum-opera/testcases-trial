<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shopping list</title>
  </head>
  <body>
    <h1>Shopping list</h1>
    <form id="add">
      <label>Item <input name="name" autocomplete="off" /></label>
      <label>Quantity <input name="quantity" autocomplete="off" /></label>
      <button type="submit">Add</button>
    </form>
    <p id="error" role="alert"></p>
    <ul id="items"></ul>
    <script>
      const form = document.getElementById("add");
      const error = document.getElementById("error");
      const items = document.getElementById("items");

      async function render() {
        const list = await (await fetch("/api/items")).json();
        items.replaceChildren(
          ...list.map((item) => {
            const li = document.createElement("li");
            const text = document.createElement("span");
            text.textContent = `${item.name} × ${item.quantity}`;
            const change = document.createElement("form");
            const field = document.createElement("input");
            field.setAttribute("aria-label", "Quantity");
            field.autocomplete = "off";
            field.value = item.quantity;
            const button = document.createElement("button");
            button.type = "submit";
            button.textContent = "Change";
            change.append(field, button);
            change.addEventListener("submit", async (event) => {
              event.preventDefault();
              const res = await fetch(`/api/items/${item.id}`, {
                method: "PATCH",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ quantity: field.value }),
              });
              const result = await res.json();
              error.textContent = res.ok ? "" : result.error;
              await render();
            });
            li.append(text, " ", change);
            return li;
          }),
        );
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const res = await fetch("/api/items", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            name: form.elements.name.value,
            quantity: form.elements.quantity.value,
          }),
        });
        const result = await res.json();
        error.textContent = res.ok ? "" : result.error;
        if (res.ok) form.reset();
        await render();
      });

      render();
    </script>
  </body>
</html>
